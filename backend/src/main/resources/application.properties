spring.application.name=collector
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=collector
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false

# Account constraints can include hashes/row values in vendor diagnostics.
# Keep these out of application logs; handled errors are logged with trace IDs only.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

collector.delivery.encryption-key=${TOKEN_DELIVERY_ENCRYPTION_KEY:}
collector.delivery.key-id=${TOKEN_DELIVERY_ENCRYPTION_KEY_ID:local-v1}
collector.delivery.app-base-url=${APP_BASE_URL:http://127.0.0.1:5173}
collector.auth.registration-per-minute=${REGISTRATION_PER_MINUTE:5}
collector.auth.verification-per-minute=${VERIFICATION_PER_MINUTE:20}

collector.auth.recovery-per-minute=${RECOVERY_PER_MINUTE:5}
collector.auth.reset-per-minute=${RESET_PER_MINUTE:20}
collector.auth.recovery-min-response-ms=${RECOVERY_MIN_RESPONSE_MS:250}

# Explicit opt-in only; startup requires a delivery key and an available adapter.
collector.delivery.worker-enabled=${ACCOUNT_DELIVERY_WORKER_ENABLED:false}
collector.delivery.batch-size=${ACCOUNT_DELIVERY_BATCH_SIZE:10}
collector.delivery.poll-ms=${ACCOUNT_DELIVERY_POLL_MS:1000}
collector.delivery.shutdown-seconds=${ACCOUNT_DELIVERY_SHUTDOWN_SECONDS:10}

# Stable external key files; all blank keeps token issuance unavailable without affecting T05/health.
collector.jwt.private-key=${JWT_PRIVATE_KEY:}
collector.jwt.public-keys=${JWT_PUBLIC_KEYS:}
collector.jwt.key-id=${JWT_KEY_ID:}
collector.jwt.issuer=${JWT_ISSUER:}
collector.jwt.audience=${JWT_AUDIENCE:}
collector.auth.token-hash-pepper=${TOKEN_HASH_PEPPER:}
collector.auth.login-per-minute=${LOGIN_PER_MINUTE:10}
collector.auth.cookie-secure=true

# The HTTP session contains CSRF state only; never use URL session identifiers.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie

# Reduced trial budgets need operator cost review; zero disables costly features safely.
collector.workspace.trial-ai-drafts=${TRIAL_AI_DRAFTS:0}
collector.workspace.trial-sms-segments=${TRIAL_SMS_SEGMENTS:0}

# Private file transfers are explicitly enabled only after storage and scanning are configured.
collector.storage.enabled=${PRIVATE_STORAGE_ENABLED:false}
collector.storage.worker-enabled=${PRIVATE_STORAGE_WORKER_ENABLED:false}

# Durable approved exports require explicitly enabled private storage.
collector.exports.worker-enabled=${EXPORT_WORKER_ENABLED:false}

# AI provider calls and maintenance remain an explicit server-only opt-in.
collector.ai.worker-enabled=${AI_WORKER_ENABLED:false}
