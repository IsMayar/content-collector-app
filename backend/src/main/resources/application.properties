spring.application.name=collector
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=collector
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false

# Account constraints can include hashes/row values in vendor diagnostics.
# Keep these out of application logs; handled errors are logged with trace IDs only.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

collector.delivery.encryption-key=${TOKEN_DELIVERY_ENCRYPTION_KEY:}
collector.delivery.key-id=${TOKEN_DELIVERY_ENCRYPTION_KEY_ID:local-v1}
collector.delivery.app-base-url=${APP_BASE_URL:http://127.0.0.1:5173}
collector.auth.registration-per-minute=${REGISTRATION_PER_MINUTE:5}
collector.auth.verification-per-minute=${VERIFICATION_PER_MINUTE:20}
