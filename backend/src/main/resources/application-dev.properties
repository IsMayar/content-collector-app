server.address=127.0.0.1
spring.datasource.hikari.maximum-pool-size=5

# Loopback-only development exception; rejected outside dev or non-loopback binding.
collector.auth.cookie-secure=false
server.servlet.session.cookie.secure=false

# Explicitly opt in to the private on-disk development inbox.
collector.delivery.dev-inbox=${ACCOUNT_DELIVERY_DEV_INBOX:false}
