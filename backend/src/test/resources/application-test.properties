# Disposable PostgreSQL container tests override connection settings.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/collector_test}
spring.datasource.username=${TEST_DATABASE_USERNAME:collector_test}
spring.datasource.password=${TEST_DATABASE_PASSWORD:unused-with-testcontainers}
server.address=127.0.0.1
spring.datasource.hikari.maximum-pool-size=3
