name: One-time formatting for client UI PR
on:
  push:
    branches:
      - ui/client-access-recovery-refresh-20261118
    paths:
      - .github/workflows/one-time-pr-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'IsMayar/content-collector-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/client-access-recovery-refresh-20261118
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format only the files requiring corrections
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write \
            src/features/analytics/pages/StatusSharePage.tsx \
            src/features/client/components/PortalFoundation.tsx \
            src/features/client/components/SubmissionControls.tsx \
            src/features/client/components/SubmissionValidationSummary.tsx \
            src/features/client/components/UnsavedDraftRecovery.tsx \
            src/features/client/pages/ClientProjectPage.tsx \
            src/shared/components/Feedback.tsx \
            src/shared/components/routing/RecoveryPages.tsx \
            tests/unit/submissions.test.tsx
      - name: Commit formatted output to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests/unit/submissions.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format client UI and submission test files"
            git push origin HEAD:ui/client-access-recovery-refresh-20261118
          fi
