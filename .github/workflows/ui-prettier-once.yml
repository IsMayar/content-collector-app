name: One-time UI Prettier correction

on:
  push:
    branches:
      - ui/final-refinement
    paths:
      - .github/workflows/ui-prettier-once.yml

permissions:
  contents: write

jobs:
  correct-formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/final-refinement
      - name: Node environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.3.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Format the two flagged UI files
        working-directory: frontend
        run: npx prettier --write src/features/billing/pages/BillingPage.tsx src/features/clients/components/ProjectContactsPanel.tsx
      - name: Commit only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/billing/pages/BillingPage.tsx frontend/src/features/clients/components/ProjectContactsPanel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format billing and project contacts for CI"
            git push origin HEAD:ui/final-refinement
          fi
