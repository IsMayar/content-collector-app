name: PowerShell script syntax
on:
  pull_request:
    paths:
      - 'backend/scripts/Diagnose-StripeWebhook.ps1'
      - 'backend/scripts/Start-DevBackendWithStripe.ps1'
      - '.github/workflows/powershell-script-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'backend/scripts/Diagnose-StripeWebhook.ps1'
      - 'backend/scripts/Start-DevBackendWithStripe.ps1'
      - '.github/workflows/powershell-script-syntax.yml'
jobs:
  parse-with-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $paths = @(
            'backend/scripts/Diagnose-StripeWebhook.ps1'
            'backend/scripts/Start-DevBackendWithStripe.ps1'
          )
          foreach ($relativePath in $paths) {
            $tokens = $null
            $parseErrors = $null
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "Windows PowerShell 5.1 syntax valid: $relativePath"
          }
