name: One-time formatting for regression test updates
on:
  push:
    branches:
      - ui/client-access-recovery-refresh-20261118
    paths:
      - .github/workflows/one-time-test-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'IsMayar/content-collector-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/client-access-recovery-refresh-20261118
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Format updated tests
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write \
            tests/unit/auth.test.tsx \
            tests/unit/client-access.test.tsx \
            tests/unit/client-questionnaire.test.tsx \
            tests/unit/project-content.test.tsx \
            tests/unit/reminders.test.tsx \
            tests/unit/review.test.tsx
      - name: Commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/unit
          if ! git diff --cached --quiet; then
            git commit -m "style(tests): format updated regression selectors"
            git push origin HEAD:ui/client-access-recovery-refresh-20261118
          fi
